set -g default-terminal "screen-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix


# Split Tmux window vertically
# Ca |
unbind %
bind | split-window -h


# Split Tmux pane horizontally
# C-a -
unbind '"'
bind -  split-window -v

# source siles C-a
unbind r
bind r source-file ~/.tmux.conf

# Resize split windows with HJKL keys 
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize window pane
bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

unbind -T copy-mode-vi MouseDragEnd1Pane
# Tmux plunin manager
set -g @plugin 'tmux-plugins/tpm'
# Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmux-themepack'



set -g @themepack 'powerline/default/cyan' 


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
bind -n C-h run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_title}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"

bind-key -r f run-shell "tmux neww ~/tmux-sessionizer.sh"
bind-key -r g run-shell "~/tmux-sessionizer.sh ~/genval"
bind-key -r p run-shell "~/tmux-sessionizer.sh ~/policyhub"


# Last Line
# Initialize tmux plugin manager

run '~/.tmux/plugins/tpm/tpm'
